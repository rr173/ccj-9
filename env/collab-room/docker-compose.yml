services:
  collab-room:
    build: .
    image: collab-room:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      COLLAB_ROOMS_FILE: /app/data/rooms.json
    volumes:
      - collab-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  collab-data:
